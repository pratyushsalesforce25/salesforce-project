<template>
    <template if:false={showThankYou}>
        <lightning-card title="Create Account & Contact">
            <div class="slds-p-around_medium">
          
                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <h2>{errorMessage}</h2>
                    </div>
                    <br/>
                </template>
       
                <template if:true={isLoading}><lightning-spinner alternative-text="Saving..."></lightning-spinner>
                </template>

                <template if:false={isLoading}>
                      <lightning-input label="Account Name"  value={accountName} onchange={handleAccountName}>  </lightning-input>
                      <lightning-input label="Account Phone" value={accountPhone} onchange={handleAccountPhone}>  </lightning-input>
                      <lightning-input label=" Contact First Name" value={firstName} onchange={handleFirstName}> </lightning-input>
                      <lightning-input label=" Contact Last Name" value={lastName} onchange={handleLastName}> </lightning-input>
                      <lightning-input label= "Contact Mobile" value={mobile} onchange={handleMobile}> </lightning-input>
                    <br/>
                    <lightning-button label="Save" variant="brand"  onclick={handleSave}> </lightning-button>
                </template>
            </div>
        </lightning-card>
    </template>
    
    <template if:true={showThankYou}>
        <lightning-card title="Thank You">
            <div class="slds-p-around_medium">
                <h2>Thank you!</h2>
                <p>Account created successfully.</p>
                <p><b>Account Name:</b> {createdAccountName}</p>
            </div>
        </lightning-card>
    </template>
</template>
